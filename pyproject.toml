[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-service-framework"
version = "0.1.1"
description = "Shared foundation for Monroe integration services: RabbitMQ request/response pipeline, handler routing, health/debug endpoints, config and lifecycle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika==9.4.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic-settings>=2.2.1",
    "psycopg2-binary>=2.9.9",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
